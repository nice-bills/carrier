<title>Pocket Epidemic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap">

<style>
  /*
    Money passed hand to hand, drawn the way a good children's book is drawn:
    flat fills, one heavy outline, a hard shadow sitting directly under the
    object. Nothing glossy, nothing gradient, nothing blurred.

    Every one of those was a tell. The gloss-and-gradient sphere in particular
    is the single most machine-generated object a layout can contain, and the
    pastel gradient sky behind it was the second. Both are gone.

    Rules held throughout:
      no monospace, no grid lines, no hairline rules  (that is the terminal look)
      no pure #000 or #fff                            (both read as untouched)
      one accent per meaning, never decoration
      asymmetry over centred stacks
      one rounded face at four weights

    Motion earns its place or it is cut:
      pop     something arrived in your hands
      bob     it is sitting with you, alive, waiting
      slip    the street reported something just now
      squish  your tap landed
    Springs throughout, since nothing physical eases linearly. The whole thing
    collapses under prefers-reduced-motion.
  */
  :root {
    --sky:     #FBFBF9;
    --sky-top: #FBFBF9;
    --ink:     #3C3C3C;
    --soft:    #7A7A7A;
    --card:    #FFFFFF;

    --coral:   #FF5A5F;
    --sun:     #FFC93C;
    --grape:   #6C4AE0;
    --deep:    #58CC02;

    --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    --glide: cubic-bezier(0.22, 1, 0.36, 1);

    --face: "Fredoka", "SF Pro Rounded", -apple-system, sans-serif;
    color-scheme: light;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0;
    min-height: 100vh;
    background: #0B1F18;
    font-family: var(--face);
    display: grid;
    place-items: center;
    padding: 12px;
  }

  .screen {
    width: min(412px, 100%);
    height: min(880px, calc(100vh - 24px));
    background: var(--sky);
    color: var(--ink);
    border-radius: 34px;
    overflow: hidden;
    position: relative;
    display: grid;
    grid-template-rows: auto 1fr auto;
  }

  /* ── top ────────────────────────────────────────────────────────────── */
  .top {
    position: relative; z-index: 2;
    display: flex; justify-content: space-between; align-items: center;
    padding: 20px 20px 4px;
  }
  .wordmark { font-weight: 700; font-size: 19px; letter-spacing: -0.02em; }
  .badge {
    font-weight: 600; font-size: 12px;
    padding: 6px 13px;
    border-radius: 100px;
    background: var(--card);
    border: 2px solid #E5E5E5;
    color: var(--soft);
  }
  .badge.lit { background: var(--sun); border-color: var(--ink); color: var(--ink); }

  /* ── the middle ─────────────────────────────────────────────────────── */
  .mid { position: relative; z-index: 2; overflow-y: auto; scrollbar-width: none; padding: 0 20px; }
  .mid::-webkit-scrollbar { display: none; }

  .cap { font-weight: 500; font-size: 13px; color: var(--soft); }

  /* the coin: a toy object, not a card */
  .coinwrap {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr);
    align-items: center;
    gap: 18px;
    padding: 16px 0 4px;
  }
  .coin {
    width: 132px; height: 132px;
    border-radius: 50%;
    display: grid; place-items: center;
    text-align: center;
    background: var(--sun);
    border: 4px solid var(--ink);
    box-shadow: 0 8px 0 var(--ink);
  }
  .coin .num {
    font-weight: 600;
    font-size: 33px;
    line-height: 1;
    letter-spacing: -0.035em;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }
  .coin .num small { font-size: 0.46em; font-weight: 600; }
  .coin .tick { font-weight: 500; font-size: 10px; color: var(--ink); opacity: 0.6; margin-top: 4px; }

  @keyframes pop {
    0%   { transform: scale(0.42) rotate(-16deg); opacity: 0; }
    100% { transform: none; opacity: 1; }
  }
  .coin.arrive { animation: pop 620ms var(--spring) both; }

  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-7px); }
  }
  .coin.rest { animation: bob 4.6s ease-in-out infinite; }

  /* the route: little beads, the one thing only Carrier can show */
  .route {
    display: flex; align-items: center; gap: 5px;
    padding: 0;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .route::-webkit-scrollbar { display: none; }
  .route > * { flex: none; }
  .facts { display: grid; gap: 9px; }
  .facts .head { font-weight: 600; font-size: 13px; color: var(--soft); }
  .bead {
    font-weight: 600; font-size: 12px;
    padding: 5px 12px;
    border-radius: 100px;
    background: var(--card);
    border: 2px solid #E5E5E5;
    color: var(--soft);
  }
  .bead.me { background: var(--ink); color: #fff; }
  .bead.dest { background: var(--coral); color: #fff; }
  .hop { color: rgba(18,53,39,0.32); font-size: 13px; font-weight: 600; }

  .nothing { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 18px; padding: 20px 0 6px; }
  .nothing .face {
    width: 110px; height: 110px;
    border-radius: 50%;
    background: #E9F7DC;
    border: 4px solid var(--ink);
    box-shadow: 0 8px 0 var(--ink);
    animation: bob 5.2s ease-in-out infinite;
  }
  .nothing h2 { margin: 0 0 6px; font-weight: 600; font-size: 21px; letter-spacing: -0.02em; }
  .nothing p { margin: 0; font-weight: 400; font-size: 13.5px; line-height: 1.45; color: var(--soft); }

  /* ── the street ─────────────────────────────────────────────────────── */
  .street { padding: 20px 0 6px; }
  .street h3 { margin: 0 0 10px; font-weight: 600; font-size: 13px; color: var(--soft); }
  .note {
    display: flex; align-items: center; gap: 10px;
    background: var(--card);
    border: 2px solid #E9E9E9;
    border-radius: 16px;
    padding: 10px 13px;
    margin-bottom: 7px;
  }
  .note .dot { width: 26px; height: 26px; border-radius: 50%; flex: none; display: grid; place-items: center; font-weight: 700; font-size: 12px; color: #fff; }
  .note p { margin: 0; font-size: 13.5px; font-weight: 400; line-height: 1.35; color: var(--soft); }
  .note p b { font-weight: 600; color: var(--ink); }
  .note p u { text-decoration: none; font-weight: 600; color: var(--coral); }
  .note time { margin-left: auto; font-size: 11.5px; color: rgba(78,122,104,0.72); white-space: nowrap; }

  @keyframes slip { from { opacity: 0; transform: translateY(-8px) scale(0.97); } to { opacity: 1; transform: none; } }
  .note.just { animation: slip 460ms var(--glide) both; }

  /* ── the bottom ─────────────────────────────────────────────────────── */
  .bottom { position: relative; z-index: 2; padding: 6px 20px 20px; }
  .bottom h3 { margin: 0 0 10px; font-weight: 600; font-size: 13px; color: var(--soft); }

  .folks { display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; padding-bottom: 12px; }
  .folks::-webkit-scrollbar { display: none; }

  .folk {
    flex: none; width: 74px;
    border: 0; background: none; padding: 0; cursor: pointer;
    font-family: inherit; color: inherit;
    display: grid; justify-items: center; gap: 6px;
  }
  .folk.enter { animation: pop 480ms var(--spring) both; }
  .folk .av {
    width: 54px; height: 54px; border-radius: 50%;
    display: grid; place-items: center;
    font-weight: 700; font-size: 20px; color: #fff;
    border: 3px solid var(--ink);
    box-shadow: 0 4px 0 var(--ink);
    transition: transform 220ms var(--spring);
  }
  .folk:active .av { transform: scale(0.9); }
  .folk[aria-pressed="true"] .av { transform: scale(1.12) translateY(-3px); }
  .folk .who { font-weight: 600; font-size: 12.5px; max-width: 74px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .folk .has { font-weight: 500; font-size: 10.5px; color: var(--soft); }
  .folk[aria-pressed="true"] .has { color: var(--ink); }

  .ring { position: relative; }
  .ring::after {
    content: "";
    position: absolute; inset: -5px;
    border-radius: 50%;
    border: 3px solid var(--sun);
    animation: halo 2.2s ease-in-out infinite;
  }
  @keyframes halo { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.09); opacity: 0.45; } }

  .noone { margin: 0 0 12px; font-size: 13.5px; line-height: 1.5; color: var(--soft); }

  .go {
    width: 100%; border: 0; cursor: pointer;
    border-radius: 100px;
    padding: 17px 22px;
    font-family: var(--face);
    font-weight: 600; font-size: 16.5px;
    color: #fff;
    background: var(--deep);
    box-shadow: 0 5px 0 #46A302;
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    transition: transform 130ms var(--spring), box-shadow 130ms var(--spring);
  }
  .go:active { transform: translateY(5px); box-shadow: 0 0 0 #46A302; }
  .go:disabled {
    background: var(--card); color: #AFAFAF;
    border: 2px solid #E5E5E5; box-shadow: none; cursor: default; transform: none;
  }
  .go .val { font-weight: 700; }

  .score {
    padding: 13px 2px 0;
    font-weight: 400;
    font-size: 13px;
    color: var(--soft);
    line-height: 1.5;
  }
  .score b { font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }

  /* ── shout ──────────────────────────────────────────────────────────── */
  .shout {
    position: absolute; left: 16px; right: 16px; bottom: 16px; z-index: 9;
    background: var(--ink); color: #fff;
    border-radius: 100px;
    padding: 15px 22px;
    font-weight: 600; font-size: 14.5px;
    text-align: center;
    transform: translateY(190%);
    transition: transform 420ms var(--spring);
    box-shadow: 0 12px 26px rgba(18,53,39,0.3);
  }
  .shout.up { transform: none; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition-duration: 1ms !important; }
  }
</style>

<div class="screen">
  <div class="top">
    <span class="wordmark">Carrier</span>
    <span class="badge" id="badge">Dormant</span>
  </div>

  <div class="mid">
    <div id="stage"></div>
    <div class="street">
      <h3>Happening around you</h3>
      <div id="street"></div>
    </div>
  </div>

  <div class="bottom">
    <h3 id="near-title">Nobody nearby</h3>
    <div class="folks" id="folks"></div>
    <p class="noone" id="noone">Carrier only works next to other people. Wait a moment, or go find them.</p>
    <button class="go" id="go" disabled>
      <span id="go-text">Nobody nearby</span><span class="val" id="go-val"></span>
    </button>
    <p class="score" id="score"></p>
  </div>

  <div class="shout" id="shout"></div>
</div>

<script>
(() => {
  "use strict";

  const NAMES = ["Ama","Chidi","Zanele","Tunde","Ngozi","Kwame","Lerato","Emeka",
                 "Sofia","Mateo","Valentina","Thiago","Ayesha","Rohan","Mei","Deniz"];
  const HUES = ["#FF5A5F","#6C4AE0","#0F8A6A","#FFC93C","#E8582F","#2E86DE","#D64C9B","#3AAE6E"];
  const RANKS = [
    { at: 0, name: "Dormant" }, { at: 1, name: "Exposed" },
    { at: 3, name: "Carrier" }, { at: 6, name: "Vector" },
    { at: 10, name: "Superspreader" },
  ];

  const $ = (id) => document.getElementById(id);
  const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = (xs) => xs[Math.floor(Math.random() * xs.length)];
  const cash = () => Math.round(rand(140, 9400)) / 100;
  const ago = (ms) => {
    const m = Math.floor(ms / 60000);
    return m < 1 ? "just now" : m < 60 ? m + " min" : Math.floor(m / 60) + " hr";
  };
  const hueFor = (name) => HUES[name.charCodeAt(0) % HUES.length];

  let uid = 1;
  const S = { folks: [], pocket: [], met: new Set(), passed: 0, sel: null, street: [], arrived: false };

  function newFolk() {
    const taken = new Set(S.folks.map((f) => f.name));
    const free = NAMES.filter((n) => !taken.has(n));
    return {
      id: uid++,
      name: pick(free.length ? free : NAMES),
      holding: Math.random() < 0.55,
      goesAt: Date.now() + rand(15000, 32000),
    };
  }

  function newCoin(from) {
    const hops = Math.floor(rand(0, 3));
    const route = Array.from({ length: hops }, () => pick(NAMES));
    if (from) route.push(from);
    return { id: uid++, amount: cash(), to: pick(NAMES), route };
  }

  function tell(html, mine) {
    S.street.unshift({ html, mine: !!mine, at: Date.now(), fresh: true });
    if (S.street.length > 30) S.street.pop();
  }

  function chatter() {
    const a = pick(NAMES);
    let b = pick(NAMES);
    while (b === a) b = pick(NAMES);
    const v = cash().toFixed(2);
    return pick([
      "<b>" + a + "</b> passed <u>" + v + "</u> to <b>" + b + "</b>",
      "<u>" + v + "</u> made it home after " + Math.floor(rand(2, 6)) + " hands",
      "<b>" + a + "</b> caught one from <b>" + b + "</b>",
      "<u>" + v + "</u> crossed town with no signal at all",
      "<b>" + a + "</b> reached " + Math.floor(rand(2, 9)) + " people this week",
    ]);
  }

  function shout(text) {
    const el = $("shout");
    el.textContent = text;
    el.classList.add("up");
    clearTimeout(shout.t);
    shout.t = setTimeout(() => el.classList.remove("up"), 1800);
  }

  function drawStage() {
    const coin = S.pocket[0];
    const box = $("stage");

    if (!coin) {
      box.innerHTML =
        '<div class="nothing"><div class="face"></div><div>' +
        "<h2>Your hands are empty</h2>" +
        "<p>Anyone with a ring around them is holding something. Take it and carry it.</p></div></div>";
      return;
    }

    const whole = Math.floor(coin.amount);
    const cents = String(Math.round((coin.amount % 1) * 100)).padStart(2, "0");
    const beads = coin.route.map((n) => '<span class="bead">' + n + "</span>");
    beads.push('<span class="bead me">You</span>');
    beads.push('<span class="bead dest">' + coin.to + "</span>");

    const entrance = S.arrived ? " arrive" : " rest";
    S.arrived = false;

    box.innerHTML =
      '<div class="coinwrap"><div class="coin' + entrance + '">' +
      '<div><div class="num">' + whole + "<small>." + cents + "</small></div>" +
      '<div class="tick">USDC</div></div></div>' +
      '<div class="facts"><span class="head">On its way to ' + coin.to + '</span>' +
      '<div class="route">' + beads.join('<span class="hop">&rsaquo;</span>') + "</div></div></div>";

    // After the arrival pop finishes, let it settle into the idle bob.
    if (!calm && entrance === " arrive") {
      const el = box.querySelector(".coin");
      setTimeout(() => { el.classList.remove("arrive"); el.classList.add("rest"); }, 640);
    }
  }

  function drawStreet() {
    $("street").innerHTML = S.street
      .slice()
      .sort((a, b) => b.at - a.at)
      .map((e) => {
        const cls = "note" + (e.fresh ? " just" : "");
        e.fresh = false;
        const named = e.html.match(/<b>([^<]+)<\/b>/);
        const actor = e.mine ? "You" : named ? named[1] : "";
        return '<div class="' + cls + '"><span class="dot" style="background:' +
          (e.mine ? "#3C3C3C" : actor ? hueFor(actor) : "#D9D9D9") + '">' + (actor ? actor[0] : "") +
          "</span><p>" + e.html + "</p><time>" + ago(Date.now() - e.at) + "</time></div>";
      })
      .join("");
  }

  /**
   * Update the row in place rather than rebuilding it.
   *
   * People arrive and leave every couple of seconds. Replacing the whole row
   * each time meant a card could be torn out from under a finger mid-tap, and
   * every remaining card restarted its entrance animation. Only genuinely new
   * people get a node, only genuinely departed people lose one.
   */
  function drawFolks() {
    const row = $("folks");
    const any = S.folks.length > 0;
    $("noone").style.display = any ? "none" : "block";
    $("near-title").textContent = any
      ? (S.folks.length === 1 ? "1 person nearby" : S.folks.length + " people nearby")
      : "Nobody nearby";

    const live = new Set(S.folks.map((f) => String(f.id)));
    Array.from(row.children).forEach((node) => {
      if (!live.has(node.dataset.id)) node.remove();
    });

    S.folks.forEach((f, i) => {
      let b = row.querySelector('[data-id="' + f.id + '"]');
      if (!b) {
        b = document.createElement("button");
        b.dataset.id = String(f.id);
        b.className = "folk enter";
        b.style.setProperty("--i", String(i));
        b.addEventListener("click", () => {
          S.sel = S.sel === f.id ? null : f.id;
          draw();
        });
        row.appendChild(b);
      }
      const met = S.met.has(f.id);
      b.setAttribute("aria-pressed", String(S.sel === f.id));
      b.innerHTML =
        '<span class="av' + (f.holding ? " ring" : "") + '" style="background:' + hueFor(f.name) + '">' +
        f.name[0] + "</span>" +
        '<span class="who">' + f.name + "</span>" +
        '<span class="has">' + (met ? "Met" : f.holding ? "Holding" : "New") + "</span>";
    });
  }

  function drawRest() {
    const n = S.met.size;
    let rank = RANKS[0];
    RANKS.forEach((r) => { if (n >= r.at) rank = r; });
    const badge = $("badge");
    badge.textContent = rank.name;
    badge.className = "badge" + (n >= 3 ? " lit" : "");

    const plural = (n, one, many) => n + " " + (n === 1 ? one : many);
    $("score").innerHTML =
      "You have met <b>" + plural(S.met.size, "person", "people") +
      "</b> and passed on <b>" + plural(S.passed, "payment", "payments") + "</b>.";

    const go = $("go");
    const f = S.folks.find((x) => x.id === S.sel);
    let text, val = "";
    if (!f) text = S.folks.length ? "Tap someone above" : "Nobody nearby";
    else if (S.pocket.length) { text = "Pass it to " + f.name; val = S.pocket[0].amount.toFixed(2); }
    else if (f.holding) text = "Take what " + f.name + " has";
    else text = "Say hi to " + f.name;
    go.disabled = !f;
    $("go-text").textContent = text;
    $("go-val").textContent = val;
  }

  function draw() { drawStage(); drawStreet(); drawFolks(); drawRest(); }

  $("go").addEventListener("click", () => {
    const f = S.folks.find((x) => x.id === S.sel);
    if (!f) return;
    const fresh = !S.met.has(f.id);
    S.met.add(f.id);

    if (S.pocket.length) {
      const amt = S.pocket[0].amount.toFixed(2);
      S.pocket.shift();
      S.passed += 1;
      f.holding = true;
      shout(f.name + " is carrying it now");
      tell("You passed <u>" + amt + "</u> to <b>" + f.name + "</b>", true);
    } else if (f.holding) {
      f.holding = false;
      S.pocket.unshift(newCoin(f.name));
      S.arrived = true;
      shout("You caught one from " + f.name);
      tell("You took <u>" + S.pocket[0].amount.toFixed(2) + "</u> from <b>" + f.name + "</b>", true);
    } else {
      shout(fresh ? "You met " + f.name : "You know " + f.name + " already");
      if (fresh) tell("You met <b>" + f.name + "</b>", true);
    }

    f.goesAt = Date.now() + rand(2800, 5400);
    S.sel = null;
    draw();
  });

  setInterval(() => {
    const now = Date.now();
    const before = S.folks.length;
    S.folks = S.folks.filter((f) => f.goesAt > now);
    while (S.folks.length < 2) S.folks.push(newFolk());
    if (S.folks.length < 4 && Math.random() < 0.4) S.folks.push(newFolk());
    if (S.folks.length !== before) {
      if (S.sel && !S.folks.some((f) => f.id === S.sel)) S.sel = null;
      drawFolks();
      drawRest();
    }
  }, calm ? 3600 : 2300);

  for (let i = 0; i < 3; i += 1) S.folks.push(newFolk());
  S.pocket.push(newCoin());
  let back = 0;
  for (let i = 0; i < 7; i += 1) {
    back += rand(150000, 900000);
    S.street.push({ html: chatter(), mine: false, at: Date.now() - back, fresh: false });
  }
  setInterval(() => { tell(chatter()); drawStreet(); }, calm ? 45000 : 21000);
  draw();
})();
</script>
