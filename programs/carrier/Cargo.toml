[package]
name = "carrier"
version = "0.1.0"
description = "Offline-first value transfer that settles when any carrier reconnects"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "carrier"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "1.2.0", features = ["init-if-needed"] }
anchor-spl = { version = "1.2.0", features = ["token", "token_2022"] }

# Anchor 1.x no longer re-exports these through its `solana_program` shim, so we
# depend on the split crates directly.
solana-instructions-sysvar = "3.0.1"
solana-sdk-ids = "3.1.0"
solana-sha256-hasher = "3.1.0"
