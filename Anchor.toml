[toolchain]
anchor_version = "1.2.0"

[features]
resolution = true
skip-lint = false

[programs.devnet]
carrier = "CJBPBb6WBPWptmpiW4Kdb7SeRC7Cmob5YAaBtKSMXBvt"

[programs.localnet]
carrier = "CJBPBb6WBPWptmpiW4Kdb7SeRC7Cmob5YAaBtKSMXBvt"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "npx vitest run --root tests"

[hooks]

[test]
startup_wait = 30000
shutdown_wait = 2000
upgradeable = false

[test.validator]
bind_address = "127.0.0.1"
url = "https://api.devnet.solana.com"
ledger = ".anchor/test-ledger"
rpc_port = 8899
